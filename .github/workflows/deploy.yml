# Optional: auto-deploy to your VPS on every push to main.
# Add these repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH (e.g. /www/wwwroot/ipcms)
# Until the secrets exist this workflow does nothing.
name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            bash deploy/deploy.sh
